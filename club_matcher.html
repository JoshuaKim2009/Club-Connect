<!DOCTYPE html>
<html>
	<head>
		<link href="styles.css?v=76" rel="stylesheet" />
		<meta name="theme-color" id="theme-color-meta" content="#1c375f">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <link href="club_discovery.css?v=29" rel="stylesheet" />

		<style>
			body {
				font-family: var(--primary-font-family);
				padding-top: env(safe-area-inset-top);
				background: var(--bg-dark);
			}

			.pageTitle {
				margin-top: 110px;
			}
		</style>

		<title>Club Connect | Club Matcher</title>
	</head>

	<body>

		<div id="loading-overlay">
			<div id="loading-overlay-inner">
				<div class="loading-spinner"></div>
				<p>LOADING...</p>
			</div>
		</div>

		<div class="chat-header">
			<button id="back-button" class="fancy-button" onclick="goToHome()">
				<i class="fa-solid fa-circle-left"></i>
			</button>

			<span class="chat-title">CLUB MATCHER</span>
		</div>

		<div id="content">
			<form id="clubMatcherForm">
				<div class="club-form-card">
					<h2>CLUB MATCHER</h2>
					<div class="club-form-section">
						<label for="interests-input">Your Interests</label>
						<textarea id="interests-input" class="fancy-input" rows="5"
                            placeholder="Tell us about your interests" maxlength="1000" autocomplete="off"></textarea>
					</div>
					<div class="club-form-actions">
						<button type="submit" id="match-button" class="fancy-button search-button">
                            FIND CLUB
							<i class="fa-solid fa-wand-magic-sparkles" style="font-size: 0.9em; margin-left: 8px;"></i>
						</button>
					</div>
				</div>

				<div class="clubs-grid" id="clubsGrid"></div>
			</form>

		</div>

		<script src="theme.js?v=12"></script>
		<script type="module" src="dialog.js?v=3"></script>
		<script type="module" src="club_matcher.js?v=3"></script>

		<script>
			function goToHome() {
				window.location.href = "join_club.html";
			}
		</script>

	</body>
</html>
