<!DOCTYPE html>
<html>
  <head>
    <link href="styles.css?v=71" rel="stylesheet" />
    <meta name="theme-color" id="theme-color-meta" content="#1c375f">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Connect | Join</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      body {
        font-family: var(--primary-font-family);
        padding-top: env(safe-area-inset-top);
        background: var(--bg-dark);
      }
      .pageTitle {
        margin-top: 110px;
      }
      #joinClubForm {
        padding-top: 113px;
      }
      
      #join-code-input::placeholder {
        text-transform: none;
      }

      .join-button {
        width: 170px;
        min-width: 85%;
      }
    </style>

  </head>
  <body>
    <div class="chat-header">
      <button id="back-button" class="fancy-button" onclick="goToHome()">
        <i class="fa-solid fa-circle-left"></i>
      </button>
      <span class="chat-title">JOIN</span>
    </div>

    <form id="joinClubForm">
      <div class="club-form-card">
        <h2>USE JOIN CODE</h2>

        <div class="club-form-section">
          <label for="club-name-input">Club Name</label>
          <input class="fancy-input" id="club-name-input"
                placeholder="Club name" required name="club-name-input"
                autocomplete="off">
        </div>

        <div class="club-form-section">
          <label for="join-code-input">Join Code</label>
          <input class="fancy-input" id="join-code-input"
                placeholder="6 character code" required name="join-code-input"
                style="text-transform: uppercase" maxlength="6" value=""
                autocomplete="off">
        </div>

        <div class="club-form-actions">
          <button id="submit-join-club-button" type="submit" class="fancy-button join-button">SEND REQUEST</button>
        </div>
      </div>
    </form>
    

    <script>
      function goToHome(){
        window.location.href = "join_club.html";
      }
    </script>

    <script src="theme.js?v=12"></script>
    <script type="module" src="dialog.js?v=3"></script> 
    <script type="module" src="join_code.js?v=9"></script>
  </body>
</html>
