<!DOCTYPE html>
<html>
	<head>
		<link href="styles.css?v=75" rel="stylesheet" />
		<meta name="theme-color" id="theme-color-meta" content="#1c375f">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Club Connect | Join</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcEA..." crossorigin="anonymous" referrerpolicy="no-referrer" />

		<style>
			body {
				font-family: var(--primary-font-family);
				padding-top: env(safe-area-inset-top);
				background: var(--bg-dark);
				padding-bottom: 2px;
			}

			.pageTitle {
				margin-top: 110px;
			}

			.join-menu {
				padding-top: 118px;
			}

			.join-menu-card {
				margin-bottom: 30px;
				font-size: 20px;
				text-align: center;
			}

			.join-menu-button {
				width: 170px;
				min-width: 85%;
				margin-top: -5px !important;
				font-size: clamp(24px, 4.5vw, 28px) !important;
			}
		</style>
	</head>

	<body>

		<div class="chat-header">
			<button id="back-button" class="fancy-button" onclick="goToHome()">
				<i class="fa-solid fa-circle-left"></i>
			</button>

			<span class="chat-title">JOIN</span>
		</div>

		<div class="join-menu">

		<!-- JOIN WITH CODE -->
		<div class="club-form-card join-menu-card">
			<h2>USE A JOIN CODE</h2>
			<label>Have an invite code? Join instantly.</label>
			<div class="club-form-actions">
				<button
					id="join-code-button"
					class="fancy-button join-menu-button">
					USE JOIN CODE
				</button>
			</div>
		</div>


		<!-- DISCOVER CLUBS -->
		<div class="club-form-card join-menu-card">
			<h2>DISCOVER CLUBS</h2>
			<label>Search clubs by school, state, and category.</label>
			<div class="club-form-actions">
				<button
					id="discover-club-button"
					class="fancy-button join-menu-button">
					DISCOVER CLUBS
				</button>
			</div>
		</div>


		<!-- CLUB MATCHER -->
		<div class="club-form-card join-menu-card">
			<h2>CLUB MATCHER</h2>
			<label>Get a personalized club recommendation.</label>
			<div class="club-form-actions">
			<button
				id="find-club-button"
				class="fancy-button join-menu-button">
				FIND MY CLUB
			</button>
			</div>
		</div>

		</div>

		<script>
		function goToHome() {
			window.location.href = "your_clubs.html";
		}

		document.getElementById("join-code-button").addEventListener("click", () => {
			window.location.href = "join_code.html";
		});

		document.getElementById("discover-club-button").addEventListener("click", () => {
			window.location.href = "club_discovery.html";
		});

		  document.getElementById("find-club-button").addEventListener("click", () => {
		    window.location.href = "club_matcher.html";
		  });
		</script>

		<script src="theme.js?v=12"></script>
		<script type="module" src="dialog.js?v=3"></script>

	</body>
</html>
