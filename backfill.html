<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Club Connect | Embedding Backfill</title>
	<style>
		body { font-family: monospace; background: #111; color: #eee; padding: 20px; max-width: 700px; }
		#log { white-space: pre-wrap; line-height: 1.5; }
		.ok { color: #6f6; }
		.skip { color: #999; }
		.err { color: #f66; }
		button { font-size: 16px; padding: 10px 16px; margin: 4px 0; }
		input { font-size: 16px; padding: 8px; margin: 4px 0; width: 280px; display: block; }
		#login-box { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #444; }
		#run-btn { display: none; }
		#status { margin-bottom: 10px; }
	</style>
</head>
<body>
	<h2>Club Embedding Backfill</h2>
	<p>One-time script: computes descriptionEmbedding / topicsEmbedding for every club that doesn't already have them.</p>

	<div id="login-box">
		<p>Log in with an account that has permission to read/write club docs (e.g. an admin account).</p>
		<input type="email" id="email-input" placeholder="Email" autocomplete="username" />
		<input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
		<button id="login-btn">Log In</button>
		<div id="login-status"></div>
	</div>

	<div id="status"></div>
	<button id="run-btn">Run Backfill</button>
	<div id="log"></div>

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
		import {
			getAuth,
			signInWithEmailAndPassword,
			onAuthStateChanged
		} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
		import {
			initializeFirestore,
			persistentLocalCache,
			persistentMultipleTabManager,
			collection,
			getDocs,
			doc,
			updateDoc
		} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
		import { getClubEmbeddings } from './embedding-utils.js';

		const firebaseConfig = {
			apiKey: "AIzaSyCBFod3ng-pAEdQyt-sCVgyUkq-U8AZ65w",
			authDomain: "club-connect-data.firebaseapp.com",
			projectId: "club-connect-data",
			storageBucket: "club-connect-data.firebasestorage.app",
			messagingSenderId: "903230180616",
			appId: "1:903230180616:web:a13856c505770bcc0b30bd",
			measurementId: "G-B8DR377JX6"
		};

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const db = initializeFirestore(app, {
			localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
		});

		const logEl = document.getElementById('log');
		const runBtn = document.getElementById('run-btn');
		const statusEl = document.getElementById('status');
		const loginBtn = document.getElementById('login-btn');
		const loginStatusEl = document.getElementById('login-status');
		const emailInput = document.getElementById('email-input');
		const passwordInput = document.getElementById('password-input');
		const loginBox = document.getElementById('login-box');

		let currentUser = null;

		function log(msg, cls = '') {
			const line = document.createElement('div');
			if (cls) line.className = cls;
			line.textContent = msg;
			logEl.appendChild(line);
			line.scrollIntoView({ block: 'end' });
		}

		onAuthStateChanged(auth, (user) => {
			currentUser = user;
			if (user) {
				loginStatusEl.textContent = `Logged in as ${user.email}`;
				loginStatusEl.className = 'ok';
				runBtn.style.display = 'inline-block';
				statusEl.textContent = 'Ready to run.';
			} else {
				runBtn.style.display = 'none';
				statusEl.textContent = '';
			}
		});

		loginBtn.addEventListener('click', async () => {
			const email = emailInput.value.trim();
			const password = passwordInput.value;

			if (!email || !password) {
				loginStatusEl.textContent = 'Enter email and password.';
				loginStatusEl.className = 'err';
				return;
			}

			loginBtn.disabled = true;
			loginStatusEl.textContent = 'Logging in...';
			loginStatusEl.className = '';

			try {
				await signInWithEmailAndPassword(auth, email, password);
				passwordInput.value = '';
			} catch (err) {
				loginStatusEl.textContent = `Login failed: ${err.message}`;
				loginStatusEl.className = 'err';
			} finally {
				loginBtn.disabled = false;
			}
		});

		async function runBackfill() {
			if (!currentUser) {
				log('You must be logged in to run the backfill.', 'err');
				return;
			}

			runBtn.disabled = true;
			loginBox.style.display = 'none';
			log(`Starting backfill at ${new Date().toISOString()} as ${currentUser.email}...`);

			let snap;
			try {
				snap = await getDocs(collection(db, "clubs"));
			} catch (err) {
				log(`Failed to fetch clubs: ${err.message}`, 'err');
				log(`If this is a permission error, confirm this account has read/write access under your Firestore rules.`, 'err');
				runBtn.disabled = false;
				return;
			}

			log(`Found ${snap.size} club(s) total.`);

			let updated = 0;
			let skipped = 0;
			let failed = 0;

			for (const clubDoc of snap.docs) {
				const data = clubDoc.data();
				const name = data.clubName || clubDoc.id;

				if (data.descriptionEmbedding && data.topicsEmbedding) {
					log(`Skipping "${name}" — already has embeddings.`, 'skip');
					skipped++;
					continue;
				}

				try {
					const { descriptionEmbedding, topicsEmbedding } = await getClubEmbeddings({
						description: data.description || '',
						topics: data.topics || []
					});

					await updateDoc(doc(db, "clubs", clubDoc.id), {
						descriptionEmbedding,
						topicsEmbedding
					});

					log(`Updated "${name}".`, 'ok');
					updated++;
				} catch (err) {
					log(`Failed on "${name}": ${err.message}`, 'err');
					failed++;
				}
			}

			log(`\nDone. Updated: ${updated}, Skipped: ${skipped}, Failed: ${failed}.`);
			runBtn.disabled = false;
		}

		runBtn.addEventListener('click', runBackfill);
	</script>
</body>
</html>
